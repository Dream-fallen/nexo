name: Nexo
version: ${project.version}
main: com.dreamfallen.nexo.NexoPlugin
api-version: '1.21'
description: Modern Python/JavaScript scripting engine for PaperMC
authors: [Dreamfallen]

commands:
  nexo:
    description: Manage Nexo scripts
    usage: /nexo <reload|list>
    permission: nexo.admin

permissions:
  nexo.admin:
    description: Allows reloading and managing Nexo scripts
    default: op
